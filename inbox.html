<!DOCTYPE html>
<html lang="en">
<head>
<!-- desk10 -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=1640, initial-scale=0.55, minimum-scale=0.25, maximum-scale=5, user-scalable=yes" />
<title>Inbox · Forge CRM</title>
<script>
(function(){var w=window.innerWidth||1640,s=w<1640?Math.max(0.45,w/1640):1;document.documentElement.style.setProperty("--app-scale",String(s));var sh=(window.screen&&window.screen.height)||900,h=window.innerHeight||900;if(h>sh*1.35)h=Math.max(760,sh);else if(s<1)h=Math.round(h/s);if(h<760)h=760;document.documentElement.style.setProperty("--app-h",h+"px");})();
</script>

<meta name="theme-color" content="#F3F5F7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/desk.css?v=desk10" />
<link rel="stylesheet" href="css/desk-more.css?v=desk10" />
<link rel="stylesheet" href="css/pages.css?v=desk10" />
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="traffic" aria-hidden="true"><b class="r"></b><b class="y"></b><b class="g"></b></div>
    <div class="word">Forge<span>CRM</span></div>
    <nav class="nav-links">
      <a href="index.html">Leads</a>
      <a href="pipeline.html">Pipeline</a>
      <a href="inbox.html" class="on">Inbox</a>
      <a href="scanner.html">Scanner</a>
      <a href="underwriting.html">Underwriting</a>
      <a href="messages.html">Messages</a>
    </nav>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input id="q" placeholder="Search inbox" autocomplete="off" />
      <kbd>/</kbd>
    </label>
    <div class="header-actions">
      <span class="live" id="livePill"><i></i> On a call</span>
      <button type="button" class="bt-btn off" id="btBtn" data-act="devices" title="Phones" aria-label="Phones">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>
        <i></i>
      </button>
      <div class="avatar" title="Cole Brennan">CB</div>
    </div>
  </header>
  <div class="work">
    <div class="split inbox">
      <aside class="side">
        <div class="side-head">
          <h2>Inbox</h2>
          <div class="meta">All communications</div>
          <label class="side-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input id="inboxQ" placeholder="People, companies, text" autocomplete="off" />
          </label>
          <div class="chips" id="tabs" style="padding:8px 0 0">
            <button type="button" class="on" data-tab="all">All</button>
            <button type="button" data-tab="msg">Messages</button>
            <button type="button" data-tab="calls">Calls</button>
            <button type="button" data-tab="mail">Email</button>
          </div>
        </div>
        <div id="feed"></div>
      </aside>
      <div class="pane-col" id="detail"></div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>
<script src="js/data.js?v=desk10"></script>
<script src="js/data1.js?v=desk10"></script>
<script src="js/data2.js?v=desk10"></script>
<script src="js/data3.js?v=desk10"></script>
<script src="js/shared.js?v=desk10"></script>
<script src="js/inbox.js?v=desk10"></script>
</body>
</html>
