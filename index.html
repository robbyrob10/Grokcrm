<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280" />

<meta name="theme-color" content="#F3F5F7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link rel="stylesheet" href="css/desk-more.css" />
<link rel="stylesheet" href="css/pages.css" />
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="traffic" aria-hidden="true"><b class="r"></b><b class="y"></b><b class="g"></b></div>
    <div class="word">Forge<span>CRM</span></div>
    <nav class="nav-links">
      <a href="index.html" class="on">Leads</a>
      <a href="pipeline.html">Pipeline</a>
      <a href="inbox.html">Inbox</a>
      <a href="scanner.html">Scanner</a>
      <a href="underwriting.html">Underwriting</a>
      <a href="messages.html">Messages</a>
    </nav>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input id="q" placeholder="Search leads, phones, companies" autocomplete="off" />
      <kbd>/</kbd>
    </label>
    <div class="header-actions">
      <span class="live" id="livePill"><i></i> On a call</span>
      <button type="button" class="bt-btn off" id="btBtn" data-act="devices" title="Phones" aria-label="Phones">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>
        <i></i>
      </button>
      <div class="avatar" title="Cole Brennan">CB</div>
    </div>
  </header>
  <div class="main" id="main">
    <aside class="rail" id="rail"><div class="empty" style="padding:28px 20px;line-height:1.5">Loading desk…</div></aside>
    <div class="handle" data-side="rail" title="Drag to resize · double-click to reset"></div>
    <section class="desk" id="desk"></section>
    <div class="handle" data-side="dock" title="Drag to resize · double-click to reset"></div>
    <aside class="dock" id="dock"></aside>
  </div>
</div>
<div class="pad-pop" id="padPop"></div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>
